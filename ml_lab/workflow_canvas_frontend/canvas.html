<div class="workflow-shell">
  <div class="canvas-toolbar">
    <div class="canvas-actions">
      <button data-action="zoom-out" aria-label="Уменьшить масштаб">−</button>
      <button data-action="zoom-in" aria-label="Увеличить масштаб">＋</button>
      <button data-action="fit">По размеру</button>
    </div>
    <span class="canvas-hint">Узлы можно перемещать · порты соединяются перетаскиванием</span>
    <span class="canvas-legend"><i></i> Данные</span>
  </div>
  <div class="canvas-viewport">
    <div class="canvas-world">
      <svg class="canvas-edges" aria-hidden="true"><defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"></path></marker></defs><g></g></svg>
      <div class="canvas-nodes"></div>
    </div>
  </div>
</div>
